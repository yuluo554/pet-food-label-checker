[build-system]
# SPDX license 字符串（`license = "MIT"`）需要 setuptools>=77：更早的版本只认
# TOML 表形态，且会给出"2027-02-18 后不再支持"的硬期限弃用警告。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-food-label-checker"
version = "0.2.0"
description = "宠物食品标签合规比对器（猫犬粮）——法规条款与国标营养限值的确定性规则引擎，逐项三态判定 + 条款锚点可溯源 + 合成标签基准可复现评测"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "yuluo554" }]
keywords = ["pet-food", "label-compliance", "rules-engine", "china-regulation", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
# 核心层零第三方依赖：判定/解析/报告/基准全部只用标准库。
# 这是"全本地零上传 + 基准可离线复现 + 冻结包体积可控"的根基，不得引入运行时依赖。
dependencies = []

[project.optional-dependencies]
# 注意：extras 一律不得进入运行时必需面。核心层在只有标准库的环境下必须完整可用。
dev = [
  "pytest>=7.0",
  # CI workflow 解析守门测试需要（断言 YAML 合法 + fetch-depth: 0）
  "pyyaml>=6.0",
  # tests/test_packaging_install.py 要**离线**打 wheel（--no-build-isolation），
  # 故构建后端必须在测试环境里；否则安装面门禁会依赖网络（红起来分不清原因）。
  "setuptools>=77",
  "wheel",
]
# GUI 是可选重件：CLI 与核心层不得依赖它。
# **钉到次版本**：入仓的演示物料（docs/demo/*.png|gif）是 Qt 渲染的字节产物，
# 换 Qt 次版本渲染结果就变——`tools/check_demo_reproducible.py` 会拿留档比对，
# 于是"CI 装到别的 6.x"会变成一次红测（v0.2.0 实测踩中：6.6.3.1 vs 6.12.0）。
# 上升次版本时必须同时重生成素材与 docs/DIST-sha256-M5.txt。
gui = ["PySide6>=6.12,<6.13"]
# 打包工具单列一组，不拖累运行时安装面。
# 打 GUI（PySide6）必须 PyInstaller >=6（5.x 扫 PySide6 字节码确定性崩）；
# floor 抬到 3.12 后 5.x 那档已无对象，合并成单档。
build = [
  "setuptools<81",
  "pyinstaller>=6.0",
]
# 演示物料通路：GIF 合成用 Pillow（PNG 截图只需 gui extra）。
# 单列一组：核心层与 CLI 都不需要它，"演示素材生成"是独立的交付通路。
demo = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/yuluo554/pet-food-label-checker"
Source = "https://github.com/yuluo554/pet-food-label-checker"

[project.scripts]
pflc = "pflc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 随包数据（DEC1 = A）：rules / benchmark / samples 住在 src/pflc/data/。
# 没有这一段，`pip install <whl>` 装出来的包**一个数据文件都没有**，
# 运行期 data_dir() 只能落到 <venv>/data（不存在）——"能跑但读不到数据"。
# knowledge 有意不入包（见 pflc/packaging.py 的 KNOWN_UNSHIPPED）。
[tool.setuptools.package-data]
pflc = ["data/*", "data/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
