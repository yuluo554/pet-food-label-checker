[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-food-label-checker"
version = "0.1.0"
description = "宠物食品标签合规比对器（猫犬粮）——法规条款与国标营养限值的确定性规则引擎，逐项三态判定 + 条款锚点可溯源 + 合成标签基准可复现评测"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["pet-food", "label-compliance", "rules-engine", "china-regulation", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
# 核心层零第三方依赖：判定/解析/报告/基准全部只用标准库。
# 这是"全本地零上传 + 基准可离线复现 + 冻结包体积可控"的根基，不得引入运行时依赖。
dependencies = []

[project.optional-dependencies]
# 注意：extras 一律不得进入运行时必需面。核心层在只有标准库的环境下必须完整可用。
dev = [
  "pytest>=7.0",
  # CI workflow 解析守门测试需要（断言 YAML 合法 + fetch-depth: 0）
  "pyyaml>=6.0",
]
# GUI 是可选重件：CLI 与核心层不得依赖它。3.8 上实测可解析最高版为 6.6.3.1。
gui = ["PySide6>=6.5,<6.7"]
# 打包工具单列一组，不拖累运行时安装面。
# 分档依据：打 GUI（PySide6）必须 PyInstaller >=6（5.x 扫 PySide6 字节码确定性崩）；
# 只打 CLI 的老解释器用 5.x 更稳（6.x 的 modulegraph 在 3.8 上低频随机崩）。
build = [
  "setuptools<81",
  "pyinstaller>=6.0; python_version >= '3.9'",
  "pyinstaller>=5.13,<6; python_version < '3.9'",
]

[project.urls]
Homepage = "https://github.com/yuluo554/pet-food-label-checker"
Source = "https://github.com/yuluo554/pet-food-label-checker"

[project.scripts]
pflc = "pflc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
