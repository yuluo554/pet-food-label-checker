name: ci

# 双平台矩阵：windows×{3.12} + ubuntu×{3.12}
#   floor 已抬到 >=3.12（3.8 于 2024-10 EOL、3.9 于 2025-10、3.10 于 2026-10），
#   3.8 通道随之撤掉；ubuntu 守 Linux 通路（编码/路径/系统库差异）。
on:
  push:
  pull_request:

# 编码三层加固的第一层：CI 全局 UTF-8。
# 本机习惯 `py -X utf8` 只救"我们敲的那条命令"，救不了 CI 步骤
# （`python -m pytest` 不是我们敲的）——见 plan/07 K22。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

# 最小权限 + 同分支并发取消：本仓只需读代码，不需要写任何 GitHub 状态。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      # fetch-depth: 0 —— 历史扫描类守门测试需要完整历史，
      # 浅克隆会把它静默削弱成空验（有守门测试断言每个 checkout 都设了 0）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 测试面 = 安装面：这里装的 extras 必须覆盖测试真 import 的每个库
      # （含 pyyaml —— CI workflow 解析守门测试需要它）
      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Show environment
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - name: Run tests
        run: python -m pytest -q -ra

      # 生成器位级一致守门（防手改冻结产物）
      - name: Frozen ruleset check
        run: python tools/gen_rulesets.py --check

      - name: Frozen samples check
        run: python tools/gen_samples.py --check

      # 真值库是"基准期望"的唯一来源——它被手改，"引擎对不对"就与
      # "真值对不对"分不开了。这一步是"冻结真值"这件事的唯一证据。
      - name: Frozen cases check
        run: python tools/gen_cases.py --check

      # 脱敏审计器阳性/阴性对照（证明扫描器真的在扫）
      - name: Desensitize auditor selftest
        run: python tools/audit_desensitize.py --selftest

      # 端到端冒烟：显式断言每条的期望退出码（不用 `|| true` 吞失败）
      - name: CLI smoke
        run: python tools/smoke_cli.py

  # 独立 job：装上 GUI extra 让 test_gui.py **真的跑起来**。
  # 只装 [dev] 时 test_gui 走模块级 importorskip 静默跳过——那等于 GUI 层
  # 的门在 CI 上从未被验证过（"门静默跳过"是本项目明令避免的失效模式）。
  test-gui:
    name: test-gui (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 的 Qt 共享库在裸 runner 上需要系统库：
      # 缺 libEGL.so.1 会让 import PySide6.QtWidgets 直接 ImportError，
      # **offscreen 平台同样要加载**（别等首跑红了才知道）。
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install (dev + gui extras)
        run: python -m pip install -e ".[dev,gui]"

      # 断言 GUI 依赖真的装上了——否则下面的 importorskip 又变成静默跳过
      - name: Assert GUI dependency present
        run: python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Run tests (GUI included)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -ra

  # 安装面验收：**非 editable 安装**必须"装完能用"。
  #
  # 为什么必须单列一个 job：其余三个 job 全部用 `pip install -e ".[dev]"`，
  # editable 安装下 repo_root() 命中仓库根，data/ 正常——于是"数据没随包"
  # 在任何一道门里都看不见。实测过：wheel 23 条目、data 条目 0、
  # 干净安装后 diagnostics 报"共 0 条"、check 输出"未评估"却 exit 0。
  #
  # 判据落在**规则条数 45** 上，不落在"退出码 0"上——失效形态正是
  # "能跑、但读不到数据"。pytest 侧的同一道门见 tests/test_packaging_install.py
  # （它在干净副本上重建 wheel，防 `build/` 与 egg-info 的陈旧清单造成假绿）。
  install-smoke:
    name: install-smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 只装构建后端：运行时依赖为空（dependencies = []），故装 wheel 不需要网络
      - name: Install build backend
        run: python -m pip install "setuptools>=77" wheel

      - name: Build wheel (non-editable)
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist-wheel

      # wheel 里必须有随包数据（rules 4 + benchmark 1 + samples 5 = 10 条目）
      - name: Assert wheel carries data files
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist-wheel/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          data = [n for n in names if "/data/" in n]
          print("wheel:", wheel)
          print("data entries:", len(data))
          for n in sorted(data):
              print("  ", n)
          if len(data) != 10:
              sys.exit("随包数据条目 %d 个（期望 10）—— 数据没随包" % len(data))
          if any("/data/knowledge/" in n for n in names):
              sys.exit("wheel 混入了 knowledge（版权敏感、有意不随包）")
          PY

      # 全新 venv + 中立目录：绝不复用源码树（复用会让 repo_root() 命中仓库根）
      - name: Install into fresh venv and smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          if [ -x "$RUNNER_TEMP/clean/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/clean/Scripts/python.exe"
            BIN="$RUNNER_TEMP/clean/Scripts"
            # Windows 上入口是 pflc.exe；Git Bash 不会为无扩展名的名字自动补 .exe
            CLI="$BIN/pflc.exe"
          else
            PY="$RUNNER_TEMP/clean/bin/python"
            CLI="$RUNNER_TEMP/clean/bin/pflc"
          fi
          "$PY" -m pip install --no-index dist-wheel/*.whl
          # 入口脚本由 pip 安装时生成，故这条断言必须在装完之后
          test -x "$CLI" || { echo "装完仍无入口脚本：$CLI"; ls -l "$(dirname "$CLI")"; exit 1; }
          mkdir -p "$RUNNER_TEMP/neutral"
          cd "$RUNNER_TEMP/neutral"
          env -u PYTHONPATH -u PFLC_DATA_DIR "$CLI" diagnostics > d.txt 2>&1 || {
            cat d.txt; exit 1; }
          cat d.txt
          # 判据落在规则条数上：退出码 0 不等于读到了数据
          grep -qE "\[label\] 共 8 条" d.txt
          grep -qE "\[nutrition\] 共 32 条" d.txt
          grep -qE "\[claim\] 共 5 条" d.txt
          env -u PYTHONPATH -u PFLC_DATA_DIR "$CLI" bench > b.txt 2>&1 || {
            cat b.txt; exit 1; }
          test "$(grep -c '\[PASS\]' b.txt)" -eq 4
          grep -q "truth_source = frozen" b.txt

  # 发行态验收：真的打出 onedir 双 exe，再在**中立目录 + 剥离环境变量**下跑
  # 冻结态三连（自检 + CLI 五连 + GUI 存活探针）。
  #
  # 为什么必须进 CI：M5 实测过两类"源码态绿、发行态红"——
  #   ① 入口点错（spec 直接指向包内模块）→ 构建成功但 exe 一启动就 ImportError；
  #   ② PyInstaller 6.x 的 _internal/ 布局让禁区扫描判据恒绿。
  # 这两类**本地源码态测试全都看不到**，只有真构建 + 真跑 exe 才会暴露。
  package:
    name: package (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # build extra 提供 PyInstaller；gui 提供 PySide6；demo 提供 Pillow（GIF 合成）
      - name: Install (dev + gui + build + demo extras)
        run: python -m pip install -e ".[dev,gui,build,demo]"

      - name: Assert build dependencies present
        run: |
          python -c "import PyInstaller, PySide6, PIL; print('PyInstaller', PyInstaller.__version__)"

      - name: Build onedir dual exe
        run: python -m PyInstaller --clean --noconfirm tools/pflc.spec

      # 冻结态三连：每个发行树都跑（判据由构建期 _datas_report.json 声明驱动）
      - name: Verify frozen CLI dist
        run: python tools/verify_frozen.py --dist dist/pflc-cli-dist --selftest

      - name: Verify frozen GUI dist
        run: python tools/verify_frozen.py --dist dist/pflc --selftest

      # 演示素材可复现性：两次独立生成，全部文件 sha256 逐个一致，
      # 且与入仓留档一致（留档若与物料脱节，发行物料就不可核证）
      - name: Demo assets reproducible
        run: python tools/check_demo_reproducible.py

      # 发布打包 + 三条判据（--check）：
      #   ① 确定性（两次打包 sha256 一致）
      #   ② 回读保真（解出的条目与源树逐字节相同）
      #   ③ 产物本体脱敏扫描（exe/dll/pyd 里的 ASCII 与 UTF-16 路径）
      # 第 ③ 条是发行侧唯一的脱敏门：dist/ 在 .gitignore 内，
      # `audit_desensitize.py --tracked` 看不到它（M5 记过这个盲区）。
      # 判据写在 tests/test_release.py，改坏打包器/扫描器必须变红。
      - name: Release pack (deterministic + readback + body scan)
        run: python tools/make_release.py --dist dist --out release --check

      # 发布物 sha256 留档与真打的 zip 对账（留档脱节 = 下载复核无从对账）
      - name: Release ledger matches archives
        run: python -m pytest tests/test_release.py -q -ra
